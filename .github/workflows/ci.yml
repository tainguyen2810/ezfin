name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.3 = production hiện tại; 8.4 = bản nâng cấp tiếp theo, giữ xanh để nâng cấp an toàn.
        php: ['8.3', '8.4']
    name: PHP ${{ matrix.php }} / MySQL 8

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: ezfin_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -psecret"
          --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ezfin_test
      DB_USERNAME: root
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, bcmath, pdo_mysql, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style
        run: vendor/bin/pint --test

      - name: Migrate (MySQL)
        run: php artisan migrate --force

      - name: Tests
        run: vendor/bin/pest

  ui:
    runs-on: ubuntu-latest
    name: Giao diện mobile/desktop (Playwright)
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci
          npx playwright install --with-deps chromium

      - name: Build and serve
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/ui.sqlite
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/ui.sqlite
          php artisan migrate --force
          npm run build
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/serve.log 2>&1 &
          sleep 3

      - name: Kiểm tra tràn ngang và lỗi JS (360/768/1280px)
        env:
          HOST_RESOLVER_RULES: MAP ezfin.test 127.0.0.1:8000
        run: npm run test:ui -- storage/app/ui-screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: storage/app/ui-screenshots
